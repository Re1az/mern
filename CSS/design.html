<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        background-color: purple;
        width: 500px;
        height: 200px;
        display: flex;
        gap: 10px;
        padding: 10px;
      }
      .bx1,
      .bx2,
      .bx3,
      .bx4 {
        background-color: yellow;
        border-radius: 20px;
        border: 1px solid black;
      }
      .bx1 {
        height: 100px;
        width: 150px;
      }
      .bx2 {
        height: 100px;
        width: 80px;
      }
      .bx3 {
        height: 100px;
        width: 200px;
        align-self: flex-end;
      }
      .bx4 {
        height: 100px;
        width: 200px;
      }
    </style>
  </head>
  <body>
    <h1>hello</h1>
    <div class="box">
      <div class="bx1"></div>
      <div class="bx2"></div>
      <div class="bx3"></div>
      <div class="bx4"></div>
    </div>
  </body>
</html>
