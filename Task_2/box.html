<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        background-color: gray;
        height: 500px;
        width: 500px;
        position: absolute;
      }
      .box1 {
        border: 1px solid black;
        background-color: red;
        height: 100px;
        width: 100px;
        position: relative;
      }
      .box2 {
        border: 1px solid black;
        background-color: red;
        height: 100px;
        width: 100px;
        position: absolute;
        left: 50px;
        z-index: 1;
      }
      .box3 {
        border: 1px solid black;
        background-color: red;
        height: 100px;
        width: 100px;
        position: absolute;
        top: 100px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="box1">
        box1
        <div class="box2">box2</div>
        <div class="box3">box3</div>
      </div>
    </div>
  </body>
</html>
