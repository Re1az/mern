<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="flex.css" />
  </head>
  <body>
    <header>
      <div class="icon-box">
        <img src="image.png" alt="" />
      </div>
      <div class="links">
        <a href="#">Product</a>
        <a href="#">Features</a>
        <a href="#">Resources</a>
        <a href="#">Pricing</a>
      </div>
      <div class="buttons">
        <button class="login">Log in</button>
        <button class="signup">Sign up</button>
      </div>
    </header>

    <!-- hero-section -->
    <main>
      <div class="hero">
        <div class="content">
          <h4>HEADER</h4>
          <h1>A small business is only as good as its tools.</h1>
          <p>
            We're different. Flex is the only saas business platform that lets
            you run your business on one platform, seamlessly across all digital
            channels.
          </p>
          <div class="buttons">
            <button class="signup">Request a Demo</button>
            <button class="login" style="border: 1px solid antiquewhite">
              Sign up
            </button>
          </div>
        </div>
        <div class="image">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTz5xtvFSatIw7U1sONs6Qv3giEBgB9XgPM1w&s"
